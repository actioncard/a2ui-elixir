name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  quality:
    name: Quality (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        elixir: ["1.19"]
        otp: ["28"]
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Restore dependencies cache
        uses: actions/cache@v6
        with:
          path: deps
          key: deps-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: deps-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-

      - name: Restore build cache
        uses: actions/cache@v6
        with:
          path: _build
          key: build-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: build-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-

      - name: Restore PLT cache
        uses: actions/cache@v6
        with:
          path: priv/plts
          key: plts-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: plts-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-

      - run: mix deps.get

      - run: mix format --check-formatted

      - run: mix credo --strict

      - run: mix dialyzer

  test:
    name: Test (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Floor: oldest Elixir allowed by mix.exs (~> 1.17) on the oldest
          # maintained OTP. Elixir 1.17 and 1.18 both top out at OTP 27.
          - elixir: "1.17"
            otp: "27"
          - elixir: "1.18"
            otp: "27"
          # Primary toolchain: quality, test-js and publish pin to this pair,
          # so they share the deps/_build caches with this cell.
          - elixir: "1.19"
            otp: "28"
          - elixir: "1.20"
            otp: "29"
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Restore dependencies cache
        uses: actions/cache@v6
        with:
          path: deps
          key: deps-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: deps-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-

      - name: Restore build cache
        uses: actions/cache@v6
        with:
          path: _build
          key: build-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: build-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-

      - run: mix deps.get

      - run: mix compile --warnings-as-errors

      - run: mix test --warnings-as-errors

  test-js:
    name: JS Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19"
          otp-version: "28"

      - name: Restore dependencies cache
        uses: actions/cache@v6
        with:
          path: deps
          key: deps-${{ runner.os }}-1.19-28-${{ hashFiles('**/mix.lock') }}
          restore-keys: deps-${{ runner.os }}-1.19-28-

      - name: Restore build cache
        uses: actions/cache@v6
        with:
          path: _build
          key: build-${{ runner.os }}-1.19-28-${{ hashFiles('**/mix.lock') }}
          restore-keys: build-${{ runner.os }}-1.19-28-

      - run: mix deps.get

      - run: mix bun test

  publish:
    name: Publish to Hex
    if: github.event_name == 'release'
    needs: [quality, test, test-js]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19"
          otp-version: "28"

      - run: mix deps.get

      - name: Verify version matches tag
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          mix_version=$(grep '@version "' mix.exs | sed 's/.*@version "//;s/"//')
          if [ "$tag" != "$mix_version" ]; then
            echo "::error::Tag v$tag does not match mix.exs version $mix_version"
            exit 1
          fi

      - run: mix hex.publish --yes
    env:
      HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
